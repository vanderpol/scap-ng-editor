name: Browser editor smoke
on:
  push:
    branches: [main]
    paths:
      - "browser-demo/**"
      - ".github/workflows/browser-demo-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test driver
        run: npm install --no-save playwright@1.56.1
      - name: Run browser smoke on Chrome
        run: |
          google-chrome --version
          python3 -m http.server 8765 --bind 127.0.0.1 --directory browser-demo >/tmp/browser-demo.log 2>&1 &
          sleep 2
          node browser-demo/tests/smoke.mjs
