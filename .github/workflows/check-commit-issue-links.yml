name: Commit issue references

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  commit-issue-references:
    name: Check each new commit cites a GitHub issue
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and commit history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require issue IDs on commits in this push
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            commits="$HEAD"
          else
            commits="$(git rev-list --reverse "$BEFORE..$HEAD")"
          fi
          failed=0
          while IFS= read -r sha; do
            [[ -n "$sha" ]] || continue
            msg="$(git show -s --format=%B "$sha")"
            if ! grep -Eq '(^|[^[:alnum:]_])#[1-9][0-9]*([^0-9]|$)' <<< "$msg"; then
              printf 'ERROR: commit %s has no GitHub issue reference; add e.g. Refs #2\n' "$sha"
              failed=1
            else
              printf 'PASS: commit %s has an issue number\n' "$sha"
            fi
          done <<< "$commits"
          exit "$failed"
