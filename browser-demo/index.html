<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SCAP-NG Studio · Browser Demo</title><link rel="stylesheet" href="./style.css"></head>
<body><header><div class="brand"><strong>SCAP-NG <span>Studio</span></strong><small>Browser authoring demo · pre-alpha research</small></div><nav><button id="import" class="button">Import YAML</button><input type="file" id="upload" multiple accept=".yaml,.yml" hidden><button id="export" class="button primary" disabled>Export YAML</button></nav></header>
<main><aside><div class="asidehead"><h2>Rule Library</h2><input type="search" id="query" placeholder="Search Rules, CCI, title…" aria-label="Search Rules"><div id="filters" class="filters"></div><div id="counter" class="counter"></div></div><div id="rules" class="rules"></div><p class="disclaimer">Only loaded Rules are indexed. Not linked ≠ impossible to automate.</p></aside>
<section class="workspace"><div class="titlebar"><div><div class="crumb" id="crumb">LOCAL BROWSER WORKSPACE</div><h1 id="title">Choose a Rule</h1></div><div class="state" id="state">No scanner connected</div></div>
<div class="tabbar"><div class="tabs" id="tabs"><button data-view="guided">Guided</button><button data-view="graphical">Graphical</button><button data-view="source">Source</button><button data-view="split">Split</button><button data-view="samples">Sample data</button></div><button id="original" class="button" disabled>Restore original</button></div>
<div id="notice" class="notice" role="status"></div><div id="content" class="content"></div><footer><span id="status">Loading pinned examples…</span><span>Local browser editing · No AI calls · No authoritative results</span></footer></section></main>
<script src="./vendor/js-yaml.min.js"></script><script src="./app.js"></script></body></html>
